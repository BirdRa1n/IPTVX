name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.12.0"
  QT_QPA_PLATFORM: offscreen

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            preset: ci           # warnings are errors
          - name: Linux
            os: ubuntu-24.04
            preset: release
          - name: Windows
            os: windows-2022
            preset: release

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libpulse-dev libva-dev libfontconfig1-dev libegl1

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        if: runner.os != 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtmultimedia
          aqtversion: ">=3.3.0"
          cache: true

      # aqtinstall does not support the per-toolchain Windows repository layout
      # used since Qt 6.11 (see tools/ci/install-qt.py).
      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        run: python tools/ci/install-qt.py --host windows_x86 --version ${{ env.QT_VERSION }} --toolchain msvc2022_64 --arch win64_msvc2022_64 --modules qtmultimedia --out "${{ runner.temp }}/Qt"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DIPTVX_ENABLE_LTO=OFF

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure

      - name: Lint QML
        if: runner.os == 'macOS'
        run: cmake --build --preset ${{ matrix.preset }} --target all_qmllint
