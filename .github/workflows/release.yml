name: Release

# Push a tag "vX.Y.Z" (tools/release.sh does it) and this workflow builds every
# platform, uploads the packages to a draft GitHub release and publishes it
# once all builds succeeded — the in-app updater never sees a half-filled
# release because drafts are invisible to /releases/latest.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.2.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  QT_VERSION: "6.12.0"
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag matches the project version
        id: version
        run: |
          version="${TAG#v}"
          project=$(sed -nE 's/^ *VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -n1)
          if [ "$version" != "$project" ]; then
            echo "::error::Tag $TAG does not match project(VERSION $project) in CMakeLists.txt"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --generate-notes --title "IPTVX ${TAG#v}"
          fi

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-15
            platform: macos
            arch: arm64
          - name: macOS (Intel)
            os: macos-15
            platform: macos
            arch: x86_64
          - name: Linux x86_64
            os: ubuntu-22.04
            platform: linux
            arch: x86_64
          - name: Linux aarch64
            # Qt's ARM64 Linux binaries need glibc 2.38+.
            os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
          - name: Windows x64
            os: windows-2022
            platform: windows
            arch: x64
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libegl1 libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libfontconfig1-dev \
            libpulse-dev libva-dev libwayland-client0 libwayland-cursor0 libwayland-egl1 file

      - name: Set up MSVC
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        if: matrix.platform != 'windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host || '' }}
          arch: ${{ matrix.qt_arch || '' }}
          modules: qtmultimedia
          # Recent aqtinstall understands the Qt 6.10+ repository layout.
          aqtversion: ">=3.3.0"
          cache: true

      # aqtinstall does not support the per-toolchain Windows repository
      # layout used since Qt 6.11, so install from download.qt.io directly.
      - name: Install Qt (Windows)
        if: matrix.platform == 'windows'
        run: python tools/ci/install-qt.py --host windows_x86 --version ${{ env.QT_VERSION }} --toolchain msvc2022_64 --arch win64_msvc2022_64 --modules qtmultimedia --out "${{ runner.temp }}/Qt"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Configure
        shell: bash
        run: |
          extra=()
          if [ "${{ matrix.platform }}" = macos ]; then
            # The deployment target defaults to the Qt build's minimum macOS.
            extra+=(-DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }})
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DIPTVX_BUILD_TESTS=OFF -DCMAKE_INSTALL_PREFIX=/usr "${extra[@]}"

      - name: Build
        run: cmake --build build --parallel

      - name: Drop unused Qt plugins
        if: matrix.platform != 'windows' # package.ps1 handles Windows
        shell: bash
        # IPTVX only uses SQLite. The other drivers (PostgreSQL, ODBC, Mimer…)
        # depend on client libraries that are not installed and would break
        # or bloat the deployment tools' output.
        # The GStreamer media backend is dropped too: IPTVX plays through the
        # FFmpeg backend, and GStreamer's libraries are not on the runners.
        run: |
          find "$QT_ROOT_DIR/plugins/sqldrivers" -type f ! -iname '*sqlite*' -delete
          find "$QT_ROOT_DIR/plugins/multimedia" -type f -iname '*gstreamer*' -delete || true

      - name: Package (macOS)
        if: matrix.platform == 'macos'
        run: packaging/macos/package.sh build "$VERSION" ${{ matrix.arch }} dist

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: |
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          packaging/linux/package.sh build "$VERSION" ${{ matrix.arch }} dist

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
          ./packaging/windows/package.ps1 -BuildDir build -Version $env:VERSION -OutDir dist

      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Add checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG"
          sha256sum IPTVX-* > SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false --latest
